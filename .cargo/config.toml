# Maintained compact extraction fork.

[build]
target-dir = "../.cache/xberg-compact/target"
incremental = true
jobs = 4

[net]
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"

# Required for PyO3 / ext-php-rs cdylibs: Python and Zend C-API symbols are
# resolved at runtime when the host loads the extension, not at link time.
# macOS ld is strict and rejects unresolved symbols by default.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.i686-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[env]
CFLAGS_i686_pc_windows_msvc = "/MD"
CFLAGS_x86_64_pc_windows_msvc = "/MD"
CXXFLAGS_i686_pc_windows_msvc = "/MD"
CXXFLAGS_x86_64_pc_windows_msvc = "/MD"
