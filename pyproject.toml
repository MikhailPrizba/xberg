[project]
name = "xberg-compact-dev"
version = "1.4.0"
requires-python = ">=3.11"
dependencies = ["xberg"]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["maturin>=1.15,<2", "pytest>=9", "pytest-asyncio>=1.4"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python"]

[tool.uv.sources]
xberg = { workspace = true }
