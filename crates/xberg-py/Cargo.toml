# Maintained compact extraction fork; see compact-profile.json.

[package]
name = "xberg-py"
edition = "2024"
description = "High-performance document intelligence library"
readme = false
keywords = [
    "document",
    "extraction",
    "ocr",
    "pdf",
    "text",
]
categories = []

[package.version]
workspace = true

[package.authors]
workspace = true

[package.license]
workspace = true

[package.metadata.cargo-machete]
ignored = [
    "pyo3-async-runtimes",
    "serde_json",
    "async-trait",
    "tracing",
    "tokio",
]

[lib]
name = "_xberg"
crate-type = [
    "cdylib",
]

[features]
tree-sitter-types = [
    "xberg/tree-sitter-types",
]
classification-types = [
    "xberg/classification-types",
]
candle-ocr-types = [
    "xberg/candle-ocr-types",
]
extension-module = [
    "pyo3/extension-module",
    "pyo3/abi3-py311",
]
default = [
    "pdf",
    "office",
    "html",
    "xml",
    "tokio-runtime",
    "auto-rotate-types",
    "layout-types",
    "embedding-presets",
    "reranker-presets",
    "sparse-embedding-presets",
    "late-interaction-presets",
    "transcription-types",
    "url-config-types",
    "api-types",
    "chunking",
    "keywords-yake",
    "keywords-rake",
    "quality",
    "redaction",
    "redaction-rehydrate",
    "diff",
    "heuristics",
    "presets",
    "markdown-footnotes",
    "svg",
    "tree-sitter-types",
    "classification-types",
    "candle-ocr-types",
]
api-types = [
    "xberg/api-types",
]
auto-rotate-types = [
    "xberg/auto-rotate-types",
]
chunking = [
    "xberg/chunking",
]
diff = [
    "xberg/diff",
]
embedding-presets = [
    "xberg/embedding-presets",
]
heuristics = [
    "xberg/heuristics",
]
html = [
    "xberg/html",
]
keywords-rake = [
    "xberg/keywords-rake",
]
keywords-yake = [
    "xberg/keywords-yake",
]
late-interaction-presets = [
    "xberg/late-interaction-presets",
]
layout-types = [
    "xberg/layout-types",
]
markdown-footnotes = [
    "xberg/markdown-footnotes",
]
office = [
    "xberg/office",
]
pdf = [
    "xberg/pdf",
]
presets = [
    "xberg/presets",
]
quality = [
    "xberg/quality",
]
redaction = [
    "xberg/redaction",
]
redaction-rehydrate = [
    "xberg/redaction-rehydrate",
]
reranker-presets = [
    "xberg/reranker-presets",
]
sparse-embedding-presets = [
    "xberg/sparse-embedding-presets",
]
svg = [
    "xberg/svg",
]
tokio-runtime = [
    "xberg/tokio-runtime",
]
transcription-types = [
    "xberg/transcription-types",
]
url-config-types = [
    "xberg/url-config-types",
]
xml = [
    "xberg/xml",
]
pdf-pdfium = [
    "xberg/pdf-pdfium",
]

[dependencies]
async-trait = "0.1"
serde_json = "1"
tracing = "0.1"

[dependencies.crawlberg]
default-features = false
version = "1.13.0"

[dependencies.html-to-markdown-rs]
default-features = false
version = "3.22.0"

[dependencies.pyo3]
version = "0.30"

[dependencies.pyo3-async-runtimes]
version = "0.30"
features = [
    "tokio-runtime",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
]

[dependencies.xberg]
version = "1.4.0"
path = "../xberg"
default-features = false
features = [
    "pdf",
    "office",
    "excel",
    "html",
    "xml",
    "email",
    "ocr-pipeline",
    "tokio-runtime",
    "simd-utf8",
    "auto-rotate-types",
    "layout-types",
    "embedding-presets",
    "reranker-presets",
    "sparse-embedding-presets",
    "late-interaction-presets",
    "transcription-types",
    "url-config-types",
    "api-types",
    "candle-ocr-types",
    "chunking",
    "keywords-yake",
    "keywords-rake",
    "quality",
    "redaction",
    "redaction-rehydrate",
    "diff",
    "enrichment",
    "heuristics",
    "presets",
    "markdown-footnotes",
    "tree-sitter-types",
    "classification-types",
    "svg",
]

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[lints.rust]
