# Maintained compact extraction fork; see compact-profile.json.

test = []

[package]
name = "xberg"
description = "Compact document extraction engine for textractor with native PDF and external OCR plugins."
repository = "https://github.com/xberg-io/xberg"
homepage = "https://xberg.io"
keywords = [
    "document",
    "extraction",
    "pdf",
    "ocr",
    "parser",
]
categories = [
    "parser-implementations",
    "text-processing",
]
readme = "README.md"
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE*",
    "/README*",
    "/build.rs",
    "/stopwords/*.json",
    "!/src/core/config/llm/tests.rs",
    "!/src/core/config/processing/tests.rs",
    "!/src/core/image_encode/tests.rs",
    "!/src/core/pipeline/initialization/registry_state.rs",
    "!/src/core/pipeline/tests.rs",
    "!/src/core/server_config/tests/**",
    "!/src/engine/extract_impl/tests.rs",
    "!/src/extraction/derive/test_support.rs",
    "!/src/extraction/derive/tests.rs",
    "!/src/extraction/derive/tests_extraction_result.rs",
    "!/src/extraction/diagram/tests.rs",
    "!/src/extraction/doc/tests.rs",
    "!/src/extraction/docx/math/tests.rs",
    "!/src/extraction/docx/styles/test_support.rs",
    "!/src/extraction/docx/styles/tests.rs",
    "!/src/extraction/docx/table/tests.rs",
    "!/src/extraction/email/tests.rs",
    "!/src/extraction/excel/tests.rs",
    "!/src/extraction/html/structure/tests.rs",
    "!/src/extraction/image/tests.rs",
    "!/src/extraction/image_decode/tests.rs",
    "!/src/extraction/image_kind/tests.rs",
    "!/src/extraction/mathml/tests.rs",
    "!/src/extraction/ooxml_embedded/tests.rs",
    "!/src/extraction/ppt/tests/**",
    "!/src/extraction/pptx/tests.rs",
    "!/src/extraction/pst/tests.rs",
    "!/src/extractors/csv/tests.rs",
    "!/src/extractors/epub/content/tests.rs",
    "!/src/extractors/pdf/ocr/numeric_repair_tests.rs",
    "!/src/extractors/pdf/ocr/plausibility_tests.rs",
    "!/src/extractors/pdf/ocr/recognition_noise_tests.rs",
    "!/src/extractors/rtf/parser/text_extract_tests.rs",
    "!/src/extractors/security/tests.rs",
    "!/src/extractors/security_tests.rs",
    "!/src/extractors/structured/tests.rs",
    "!/src/language_detection/tests.rs",
    "!/src/pdf/native/images/parallel_tests.rs",
    "!/src/pdf/native/images/tests.rs",
    "!/src/pdf/scan_detect/tests.rs",
    "!/src/pdf/scan_detect_type3_tests.rs",
    "!/src/pdf/structure/pipeline/list_marker_tests.rs",
    "!/src/pdf/structure/pipeline/tests.rs",
    "!/src/plugins/ocr/tests.rs",
    "!/src/rendering/common/tests.rs",
    "!/src/rendering/doctags/tests.rs",
    "!/src/rendering/pdf/tests.rs",
    "!/src/types/document_structure/tests.rs",
    "!/src/types/formats/tests.rs",
    "!/src/types/internal/tests.rs",
    "!/src/utils/test_support.rs",
    "!/src/extraction/excel/tests/**",
    "!/src/chunking/testdata/**",
    "!/src/pdf/testdata/**",
    "!/src/text/testdata/**",
]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.authors]
workspace = true

[package.license]
workspace = true

[package.metadata.cargo-machete]
ignored = [
    "icu_provider",
    "serde_toon_format",
    "getrandom",
    "getrandom_02",
    "getrandom_03",
]

[lib]
crate-type = [
    "rlib",
]

[features]
default = [
    "tokio-runtime",
    "simd-utf8",
]
simd-utf8 = [
    "dep:simdutf8",
]
tokio-runtime = [
    "dep:tokio",
]
pdf = [
    "pdf-native",
]
pdf-native = [
    "dep:xberg-native-pdf",
    "dep:lopdf",
    "dep:lopdf-compat",
    "dep:image",
    "dep:flate2",
    "html",
    "image-encode",
]
pdf-pdfium = [
    "dep:pdfium-render",
    "tokio-runtime",
]
excel = [
    "dep:calamine",
    "dep:cfb",
    "dep:roxmltree",
    "dep:zip",
    "dep:quick-xml",
    "tokio-runtime",
]
office = [
    "dep:cfb",
    "dep:flate2",
    "dep:roxmltree",
    "dep:zip",
    "dep:quick-xml",
    "dep:biblatex",
    "dep:biblib",
    "dep:unicode-normalization",
    "dep:org",
    "dep:dbase",
    "dep:typst-syntax",
    "dep:mathemascii",
    "dep:html-escape",
    "html",
    "notebook",
]
