    "html",
    "dep:unicode-width",
]
email = [
    "dep:mail-parser",
    "dep:cfb",
    "dep:outlook-pst",
    "dep:tempfile",
    "dep:chrono",
    "dep:chardetng",
    "html",
]
html = [
    "dep:html-to-markdown-rs",
    "dep:v_htmlescape",
]
xml = [
    "dep:quick-xml",
    "dep:roxmltree",
]
image-encode = [
    "dep:image",
]
image-metadata = [
    "dep:nom-exif",
]
ocr-pipeline = [
    "image-metadata",
    "dep:image",
    "image-encode",
    "dep:fast_image_resize",
    "language-detection",
]
tree-sitter-types = []
classification-types = []
candle-ocr-types = []
language-detection = [
    "dep:whatlang",
]
layout-types = []
auto-rotate-types = []
transcription-types = []
chunking = [
    "dep:auto_enums",
    "dep:either",
    "dep:icu_provider",
    "dep:icu_segmenter",
    "dep:itertools",
    "dep:strum",
]
embedding-presets = []
reranker-presets = []
sparse-embedding-presets = []
late-interaction-presets = []
stopwords = []
quality = [
    "dep:unicode-normalization",
    "dep:chardetng",
    "stopwords",
    "heuristics",
]
enrichment = []
heuristics = []
keywords-yake = [
    "stopwords",
]
keywords-rake = [
    "dep:rake",
    "stopwords",
]
markdown-footnotes = []
diff = [
    "dep:similar",
]
presets = [
    "dep:include_dir",
    "dep:jsonschema",
    "dep:sha2",
]
redaction = [
    "dep:sha2",
]
redaction-rehydrate = [
    "redaction",
    "dep:aes-gcm",
    "dep:scrypt",
