# Maintained compact extraction fork; generated PDFium bindings are checked in.

[package]
workspace = "../.."
name = "xberg-pdfium-render"
description = "High-level idiomatic Rust wrapper around Pdfium. Fork of pdfium-render with Xberg patches."
license = "MIT"
homepage = "https://xberg.io"
documentation = "https://docs.rs/xberg-pdfium-render"
keywords = [
    "pdf",
    "pdfium",
    "rendering",
    "extraction",
]
categories = [
    "api-bindings",
    "multimedia::images",
]
readme = "README.md"
build = "build.rs"
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE*",
    "/README*",
    "/build.rs",
    "!/src/pdf/document/page/object/group/tests.rs",
    "!/src/pdf/document/page/object/image/tests.rs",
    "!/src/pdf/document/page/object_tests.rs",
    "!/src/pdf/document/page/tests.rs",
]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.metadata]

[lib]
name = "pdfium_render"
crate-type = [
    "lib",
]
doctest = false

[features]
default = [
    "image_latest",
    "thread_safe",
]
thread_safe = []
image_latest = [
    "image_025",
]
image_025 = [
    "dep:image_025",
]

[dependencies]
bitflags = "2"
bytemuck = "1"
maybe-owned = "0.3"
utf16string = "0.2"
vecmath = "1"

[dependencies.chrono]
workspace = true

[dependencies.image_025]
package = "image"
version = "0.25"
optional = true
default-features = false
features = [
    "jpeg",
]

[dependencies.itertools]
workspace = true

[dependencies.log]
workspace = true

[dependencies.once_cell]
workspace = true

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
libloading = "0.9"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    "cfg(pdfium_use_static)",
]
