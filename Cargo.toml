# Maintained compact extraction fork; see compact-profile.json.

[workspace]
members = [
    "crates/xberg",
    "crates/xberg-native-pdf",
    "crates/xberg-py",
    "crates/xberg-pdfium-render",
]
default-members = [
    "crates/xberg-py",
]
resolver = "2"

[workspace.package]
version = "1.4.0+textractor.1"
edition = "2024"
rust-version = "1.99"
authors = [
    "Na'aman Hirschfeld <naaman@xberg.io>",
    "Tobias Perlstein <tobias@xberg.io>",
]
license = "MIT"
repository = "https://github.com/xberg-io/xberg"
homepage = "https://xberg.io"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = []

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.lints.clippy.all]
level = "warn"
priority = -1

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1"
cfb = "0.16"
chrono = "0.4"
dbase = "0.8"
hex = "0.4.3"
itertools = "0.15"
libc = "0.2.191"
memmap2 = "0.9"
mime = "0.3.18"
num_cpus = "1.17.0"
once_cell = "1.21.4"
parking_lot = "0.13.0"
rayon = "1.12.0"
serde_toon_format = "0.2"
sha2 = "0.11"
similar = "3"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1"
url = "2.5.8"

[workspace.dependencies.ahash]
version = "0.8.12"
features = [
    "serde",
]

[workspace.dependencies.bytes]
version = "1"
features = [
    "serde",
]

[workspace.dependencies.comrak]
version = "0.59"
default-features = false

[workspace.dependencies.crawlberg]
version = "1.13.0"
default-features = false

[workspace.dependencies.criterion]
version = "0.8"
features = [
    "html_reports",
]

[workspace.dependencies.html-to-markdown-rs]
version = "3.22.0"
default-features = false

[workspace.dependencies.image]
version = "0.25.10"
default-features = false

[workspace.dependencies.log]
version = "0.4"
features = [
    "std",
]

[workspace.dependencies.nom-exif]
version = "3.8"
default-features = false

[workspace.dependencies.pdfium-render]
package = "xberg-pdfium-render"
path = "./crates/xberg-pdfium-render"
version = "1.4.0"

[workspace.dependencies.resvg]
version = "0.49"
default-features = false

[workspace.dependencies.serde]
version = "1.0.229"
features = [
    "derive",
]

[workspace.dependencies.serde_json]
version = "1.0.154"

[workspace.dependencies.tokio]
version = "1.54.1"
features = [
    "rt",
    "macros",
    "sync",
    "time",
    "io-util",
]

[workspace.dependencies.usvg]
version = "0.49"
default-features = false
features = [
    "writer",
]

[workspace.dependencies.xberg-native-pdf]
path = "./crates/xberg-native-pdf"
version = "1.4.0"

[patch.crates-io.xberg]
path = "crates/xberg"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true

[profile.release.package.zip]
opt-level = 2

[profile.dev]
opt-level = 0
debug = true
